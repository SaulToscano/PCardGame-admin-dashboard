name: Deploy Dashboard to Oracle VM

on:
  push:
    branches:
      - main 

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker Image in GitHub
        run: docker build -t tcg-dashboard-image .

      - name: Save Docker Image to Tar file
        run: docker save tcg-dashboard-image -o dashboard.tar

      - name: Create folder on server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: mkdir -p ~/tcg_dashboard

      - name: Copy Docker Image to Oracle VM via SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "dashboard.tar"
          target: "~/tcg_dashboard"

      - name: Load and Run Container on Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Cargamos la imagen preconstruida al Docker del servidor
            sudo docker load -i ~/tcg_dashboard/dashboard.tar
            
            # Detenemos y borramos el contenedor anterior (si existe)
            sudo docker stop tcg-dashboard || true
            sudo docker rm tcg-dashboard || true
            
            # Levantamos el nuevo contenedor en el puerto 4200
            sudo docker run -d --restart unless-stopped --name tcg-dashboard -p 4200:80 tcg-dashboard-image
            
            # Limpiamos el archivo tar para ahorrar espacio en Oracle
            rm ~/tcg_dashboard/dashboard.tar