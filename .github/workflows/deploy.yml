name: Deploy Dashboard to Oracle VM

on:
  push:
    branches:
      - main 

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Instalar emuladores para compilar en otras arquitecturas
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 2. Compilar forzando la arquitectura de Oracle (linux/arm64)
      - name: Build Docker Image for ARM64
        run: docker buildx build --platform linux/arm64 -t tcg-dashboard-image -o type=docker .

      - name: Save Docker Image to Tar file
        run: docker save tcg-dashboard-image -o dashboard.tar

      - name: Create folder on server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: mkdir -p ~/tcg_dashboard

      - name: Copy Docker Image to Oracle VM via SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "dashboard.tar"
          target: "~/tcg_dashboard"

      - name: Load and Run Container on Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            sudo docker load -i ~/tcg_dashboard/dashboard.tar
            sudo docker stop tcg-dashboard || true
            sudo docker rm tcg-dashboard || true
            sudo docker run -d --restart unless-stopped --name tcg-dashboard -p 4200:80 tcg-dashboard-image
            rm ~/tcg_dashboard/dashboard.tar