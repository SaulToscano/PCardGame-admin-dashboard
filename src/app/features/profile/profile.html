<div class="flex justify-content-center mt-5">
  <p-card header="Perfil de Administrador" [style]="{ width: '450px' }" styleClass="shadow-3 border-round-xl">
    
    <div class="flex flex-column align-items-center mb-4">
      <img src="/mockups/images/default.png" alt="Avatar" class="border-circle shadow-2 mb-3" style="width: 100px; height: 100px;">
      <span class="text-2xl font-bold text-900">{{ user.username }}</span>
      <span class="text-primary font-medium mt-1">Nivel de Permiso: {{ user.permission_level }}</span>
    </div>

    <div class="flex flex-column gap-3 mt-4">
      <div class="flex justify-content-between align-items-center border-bottom-1 surface-border pb-2">
        <span class="font-semibold text-600">ID de Usuario</span>
        <span class="text-900 font-medium">{{ user.id }}</span>
      </div>
      <div class="flex justify-content-between align-items-center border-bottom-1 surface-border pb-2">
        <span class="font-semibold text-600">Nivel de Validación</span>
        <span class="text-900 font-medium">{{ user.validation_level }}</span>
      </div>
      <div class="flex justify-content-between align-items-center border-bottom-1 surface-border pb-2">
        <span class="font-semibold text-600">Versión del Servidor</span>
        <span class="text-900 font-medium">{{ user.version }}</span>
      </div>
    </div>

    <div class="mt-5">
      <p-button label="Cerrar Sesión" icon="pi pi-sign-out" severity="danger" styleClass="w-full p-3 font-bold" (onClick)="logout()"></p-button>
    </div>
    
  </p-card>
</div>
