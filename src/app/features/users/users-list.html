<p-toast />
<div>
  <p-card header="Gestión de Jugadores" class="shadow-3 border-round-xl">
    
    <!-- La tabla de PrimeNG con paginación incorporada -->
    <p-table 
      [value]="users" 
      [loading]="loading" 
      [paginator]="true" 
      [rows]="10" 
      [rowsPerPageOptions]="[10, 25, 50]"
      class="p-datatable-sm p-datatable-striped">
      
      <ng-template pTemplate="header">
        <tr>
          <th pSortableColumn="username">Usuario <p-sortIcon field="username"></p-sortIcon></th>
          <th pSortableColumn="email">Correo Electrónico <p-sortIcon field="email"></p-sortIcon></th>
          <th pSortableColumn="coins" class="text-center">Monedas <p-sortIcon field="coins"></p-sortIcon></th>
          <th pSortableColumn="xp" class="text-center">XP <p-sortIcon field="xp"></p-sortIcon></th>
          <th pSortableColumn="elo" class="text-center">ELO <p-sortIcon field="elo"></p-sortIcon></th>
          <th class="text-center">Nivel Permiso</th>
        </tr>
      </ng-template>
      
      <ng-template pTemplate="body" let-user>
        <tr>
          <td class="font-bold text-900">{{ user.username }}</td>
          <td class="text-600">{{ user.email }}</td>
          <td class="text-center font-medium text-yellow-600">{{ user.coins }} <i class="pi pi-stop-circle text-xs"></i></td>
          <td class="text-center font-medium text-green-600">{{ user.xp }}</td>
          <td class="text-center font-bold text-primary">{{ user.elo }}</td>
          <td class="text-center">
            <!-- Usamos un Tag visual para diferenciar administradores de jugadores -->
            <p-tag 
              [value]="user.permission_level >= 5 ? 'Admin/Server' : 'Jugador'" 
              [severity]="user.permission_level >= 5 ? 'danger' : 'info'">
            </p-tag>
          </td>
        </tr>
      </ng-template>
      
      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="6" class="text-center p-4 text-600">
            No se encontraron usuarios en la base de datos.
          </td>
        </tr>
      </ng-template>
      
    </p-table>
  </p-card>
</div>
